# Front of the cluster stand (test/cluster/docker-compose.yaml). Upstreams are
# IPs, not names: nginx starts before the gateways and never keeps a stale
# address after a container restart.
worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 20000; }

http {
  proxy_http_version 1.1;
  # WebSocket (web terminal, live view): pass Upgrade, keep idle sockets for an hour.
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_connect_timeout 1s;
  upstream werbot_http { server 10.231.0.11:8080; server 10.231.0.12:8080; }
  upstream werbot_web  { server 10.231.0.31:8090; server 10.231.0.32:8090; }
  # API for gateways and the harness (Edge): any server replica.
  server { listen 80 default_server; location / { proxy_pass http://werbot_http; } }
  # UI on its own host: werbot web replicas (10 §8.3 #13).
  server { listen 80; server_name ui.werbot.test; location / { proxy_pass http://werbot_web; } }
  # One server replica each (harness A and B, /readyz): server HTTP is not published.
  server { listen 8081; location / { proxy_pass http://10.231.0.11:8080; } }
  server { listen 8082; location / { proxy_pass http://10.231.0.12:8080; } }
}

stream {
  proxy_connect_timeout 1s;
  proxy_timeout 1h;
  # Tunnel: L4 passthrough, no PROXY protocol. gw1 -> server1, gw2 -> server2 (backup = failover); the rest round-robin.
  upstream tunnel_a   { server 10.231.0.11:8443; server 10.231.0.12:8443 backup; }
  upstream tunnel_b   { server 10.231.0.12:8443; server 10.231.0.11:8443 backup; }
  upstream tunnel_any { server 10.231.0.11:8443; server 10.231.0.12:8443; }
  map $remote_addr $tunnel { 10.231.0.21 tunnel_a; 10.231.0.22 tunnel_b; default tunnel_any; }
  server { listen 8443; proxy_pass $tunnel; }
  # SSH: PROXY protocol v1 to the gateways.
  upstream ssh_pool { server 10.231.0.21:2222; server 10.231.0.22:2222; }
  server { listen 2222; proxy_pass ssh_pool;          proxy_protocol on; }
  server { listen 2201; proxy_pass 10.231.0.21:2222;  proxy_protocol on; }
  server { listen 2202; proxy_pass 10.231.0.22:2222;  proxy_protocol on; }
}

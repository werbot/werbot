version: "2"
linters:
  default: none
  enable: [bodyclose, depguard, gocritic, gosec, govet, ineffassign, misspell, nolintlint, revive, sqlclosecheck, staticcheck, unconvert, unparam, unused, whitespace]
  settings:
    depguard:
      rules:
        sdk:
          files: ["**/sdk/*.go", "**/sdk/**/*.go"]
          deny:
            - pkg: github.com/werbot/werbot/internal
              desc: sdk is a public contract and must not import internal packages
        platform:
          files: ["**/internal/platform/**/*.go"]
          deny:
            - { pkg: github.com/werbot/werbot/internal/app, desc: platform must not import the composition root }
            - { pkg: github.com/werbot/werbot/internal/tunnel, desc: platform must not import the tunnel handler }
            - { pkg: github.com/werbot/werbot/internal/identity, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/inventory, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/credential, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/policy, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/access, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/session, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/audit, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/notify, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/gateway, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/system, desc: platform must not import domains }
            - { pkg: github.com/werbot/werbot/internal/agentic, desc: platform must not import domains }
        system:
          files: ["**/internal/system/*.go", "**/internal/system/**/*.go"]
          deny:
            - { pkg: github.com/werbot/werbot/internal/app, desc: domains must not import the composition root }
            - { pkg: github.com/werbot/werbot/internal/tunnel, desc: domains must not import the tunnel handler }
            - { pkg: github.com/werbot/werbot/internal/identity, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/inventory, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/credential, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/policy, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/access, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/session, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/audit, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/notify, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/gateway, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/agentic, desc: domains must not import other domains }
        notify:
          files: ["**/internal/notify/*.go", "**/internal/notify/**/*.go"]
          deny:
            - { pkg: github.com/werbot/werbot/internal/app, desc: domains must not import the composition root }
            - { pkg: github.com/werbot/werbot/internal/tunnel, desc: domains must not import the tunnel handler }
            - { pkg: github.com/werbot/werbot/internal/identity, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/inventory, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/credential, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/policy, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/access, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/session, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/audit, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/gateway, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/system, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/agentic, desc: domains must not import other domains }
        identity:
          files: ["**/internal/identity/*.go", "**/internal/identity/**/*.go"]
          deny:
            - { pkg: github.com/werbot/werbot/internal/app, desc: domains must not import the composition root }
            - { pkg: github.com/werbot/werbot/internal/tunnel, desc: domains must not import the tunnel handler }
            - { pkg: github.com/werbot/werbot/internal/inventory, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/credential, desc: domains must not import other domains }
            - { pkg: github.com/werbot/werbot/internal/policy, desc: domains must not import other domains }

            - { pkg: github.com/werbot/werbot/internal/gateway, desc: connector may import only platform and gen }
            - { pkg: github.com/werbot/werbot/internal/system, desc: connector may import only platform and gen }
            - { pkg: github.com/werbot/werbot/internal/agentic, desc: connector may import only platform and gen }
        inventory:
          files: ["**/internal/inventory/*.go", "**/internal/inventory/**/*.go"]
          deny:
            - { pkg: github.com/werbot/werbot/internal/app, desc: domains must not import each other }
            - { pkg: github.com/werbot/werbot/internal/tunnel, desc: domains must not import the tunnel handler }
            - { pkg: github.com/werbot/werbot/internal/identity, desc: domains must not import each other }

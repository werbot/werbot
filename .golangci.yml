version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    goconst:
      min-len: 5
      min-occurrences: 4
    gosec:
      excludes:
        - G202
        - G401
        - G501
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test tables intentionally repeat string literals; extraction into
      # constants makes them harder to read.
      - linters:
          - goconst
        path: _test\.go
      # Tests and fixtures contain intentionally hardcoded credentials.
      - linters:
          - gosec
        path: _test\.go
        text: G101
      - linters:
          - gosec
        path: (^|/)internal/utils/test/
        text: G101
      - linters:
          - staticcheck
        text: 'S1002: should omit comparison to bool constant'
      - linters:
          - revive
        text: 'exported: exported const'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

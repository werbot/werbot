          files: ["**/internal/connector/*.go", "**/internal/connector/**/*.go"]
          deny:
            - { pkg: github.com/werbot/werbot/internal/app, desc: connector may import only platform and gen }
            - { pkg: github.com/werbot/werbot/internal/tunnel, desc: connector may import only platform and gen }
            - { pkg: github.com/werbot/werbot/internal/identity, desc: connector may import only platform and gen }
            - { pkg: github.com/werbot/werbot/internal/inventory, desc: connector may import only platform and gen }
            - { pkg: github.com/werbot/werbot/internal/credential, desc: connector may import only platform and gen }

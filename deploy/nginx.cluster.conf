# Load balancer of docker-compose.cluster.yaml. Upstreams resolve service names
# through Docker DNS and re-read them: nginx starts before the gateways and
# follows the new IPs of restarted replicas.
worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 16384; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream werbot_web { zone werbot_web 64k; server web:8090 resolve; }
  # UI and API, including gateway enrollment: server HTTP is reached only through web.
  server {
    listen 8080;
    location / {
      proxy_pass http://werbot_web;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}

stream {
  resolver 127.0.0.11 valid=10s ipv6=off;
  # idle SSH longer than WERBOT_GATEWAY_IDLE_TIMEOUT is cut by the gateway, not here
  proxy_timeout 1h;
  # Gateway tunnel: plain L4 passthrough, mTLS ends on a server replica.
  upstream werbot_tunnel { zone werbot_tunnel 64k; server server:8443 resolve; }
  server { listen 8443; proxy_pass werbot_tunnel; }
  # SSH to the pool: PROXY protocol carries the client IP to the gateways.
  upstream werbot_ssh { zone werbot_ssh 64k; server gateway-1:2222 resolve; server gateway-2:2222 resolve; }
  server { listen 2222; proxy_pass werbot_ssh; proxy_protocol on; }
}

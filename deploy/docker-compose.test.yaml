name: werbot-test

services:
  testdb:
    container_name: werbot-testdb
    image: postgres:18-alpine
    ports:
      - "27432:5432"
    environment:
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

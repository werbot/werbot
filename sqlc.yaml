version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/identity/queries.sql
    gen:
      go:
        package: dbq
        out: internal/identity/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/inventory/queries.sql
    gen:
      go:
        package: dbq
        out: internal/inventory/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/credential/queries.sql
    gen:
      go:
        package: dbq
        out: internal/credential/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/access/queries.sql
    gen:
      go:
        package: dbq
        out: internal/access/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema: migrations
    queries: internal/policy/queries.sql
    gen:
      go:
        package: dbq
        out: internal/policy/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides

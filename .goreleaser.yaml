version: 2

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod download

snapshot:
  version_template: "{{ incpatch .Version }}-next"

builds:
  - &go-build
    id: avocado
    main: ./cmd/avocado
    binary: werbot_avocado
    ldflags:
      - -s -w
      - -X github.com/werbot/werbot/internal/version.version={{ .Version }}
      - -X github.com/werbot/werbot/internal/version.gitCommit={{ .ShortCommit }}
      - -X github.com/werbot/werbot/internal/version.buildDate={{ .Date }}
    goos: [linux]
    goarch: [amd64, arm64]
  - <<: *go-build
    id: buffet
    main: ./cmd/buffet
    binary: werbot_buffet
  - <<: *go-build
    id: ghost
    main: ./cmd/ghost
    binary: werbot_ghost
  - <<: *go-build
    id: taco
    main: ./cmd/taco
    binary: werbot_taco

archives:
  - ids: [avocado, buffet, ghost, taco]
    formats: [binary]
    name_template: "{{ .Binary }}_{{ title .Os }}_{{ .Arch }}"

dockers_v2:
  - id: avocado
    ids: [avocado]
    dockerfile: docker/release/Dockerfile.avocado
    images: [ghcr.io/werbot/avocado]
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    sbom: false
    flags: [--pull]
    labels: &image-labels
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .ShortCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.vendor: Werbot, Inc.
      org.opencontainers.image.authors: info@werbot.com
      org.opencontainers.image.licenses: Business Source License 1.1
      org.opencontainers.image.url: "{{ replace (replace .GitURL \"git@github.com:\" \"https://github.com/\") \".git\" \"\" }}"
      org.opencontainers.image.documentation: "{{ replace (replace .GitURL \"git@github.com:\" \"https://github.com/\") \".git\" \"\" }}"
      org.opencontainers.image.source: "{{ replace (replace .GitURL \"git@github.com:\" \"https://github.com/\") \".git\" \"\" }}"
      org.opencontainers.image.title: avocado
      org.opencontainers.image.description: "🥑 avocado - worker server"
  - id: buffet
    ids: [buffet]
    dockerfile: docker/release/Dockerfile.buffet
    images: [ghcr.io/werbot/buffet]
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    sbom: false
    flags: [--pull]
    labels:
      <<: *image-labels
      org.opencontainers.image.title: buffet
      org.opencontainers.image.description: "🍱 buffet - gRPC server"
  - id: ghost
    ids: [ghost]
    dockerfile: docker/release/Dockerfile.ghost
    images: [ghcr.io/werbot/ghost]
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    sbom: false
    flags: [--pull]
    extra_files:
      - cmd/ghost/templates
    labels:
      <<: *image-labels
      org.opencontainers.image.title: ghost
      org.opencontainers.image.description: "👻 ghost - master microservice"
  - id: taco
    ids: [taco]
    dockerfile: docker/release/Dockerfile.taco
    images: [ghcr.io/werbot/taco]
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    sbom: false
    flags: [--pull]
    labels:
      <<: *image-labels
      org.opencontainers.image.title: taco
      org.opencontainers.image.description: "🌮 taco - public API server"

upx:
  - enabled: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - init
      - "^.*?ci:"
      - "^.*?test:"
      - "^.*?build(deps):"
      - "^.*?build:"
      - README
      - Up
      - merge conflict
      - Bump
      - Small fix
      - Update
      - Updating
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: '^.*?(feat|fix)\(deps\)!?:.+$'
      order: 300
    - title: New Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: Security updates
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 150
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: Documentation updates
      regexp: '^.*?doc(\([[:word:]]+\))??!?:.+$'
      order: 400
    - title: Build process updates
      regexp: '^.*?build(\([[:word:]]+\))??!?:.+$'
      order: 400
    - title: Other work
      order: 9999

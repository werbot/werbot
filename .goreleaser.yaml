version: 2
project_name: werbot
before: { hooks: ["make web VERSION={{ .Version }}"] } # UI build version = binary version (version banner)
snapshot: { version_template: "{{ incpatch .Version }}-next" }

builds:
  - id: werbot
    main: ./cmd/werbot
    binary: werbot
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows] # windows: only `werbot connect` is supported (stage 6b)
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/werbot/werbot/internal/platform/version.Version={{ .Version }}
      - -X github.com/werbot/werbot/internal/platform/version.Commit={{ .ShortCommit }}
      - -X github.com/werbot/werbot/internal/platform/version.BuildDate={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides: [{ goos: windows, formats: [zip] }]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
    builds_info: { mtime: "{{ .CommitDate }}" }

checksum: { name_template: checksums.txt }

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    output: true
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

dockers_v2:
  - images: [ghcr.io/werbot/werbot]
    tags: ["v{{ .Version }}"]
    dockerfile: deploy/Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: werbot
      org.opencontainers.image.description: Open-source access gateway for people and AI agents
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.vendor: Werbot, Inc.
      org.opencontainers.image.source: https://github.com/werbot/werbot
      org.opencontainers.image.url: https://github.com/werbot/werbot
      org.opencontainers.image.documentation: "https://github.com/werbot/werbot/tree/{{ .Tag }}/docs"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      io.modelcontextprotocol.server.name: io.github.werbot/werbot
    annotations:
      org.opencontainers.image.description: Open-source access gateway for people and AI agents
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.source: https://github.com/werbot/werbot

docker_signs:
  - cmd: cosign
    output: true
    args: [sign, "${artifact}@${digest}", --yes]

changelog:
  use: git
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - '^\S+ (test|ci|chore|style)(\(.+?\))?: '
      - '^Merge '
  groups:
    - { title: "⚠️ Breaking changes", regexp: '^\S+ \w+(\(.+?\))?!: ', order: 0 }
    - { title: "✨ Features", regexp: '^\S+ feat(\(.+?\))?: ', order: 1 }
    - { title: "🐛 Bug fixes", regexp: '^\S+ fix(\(.+?\))?: ', order: 2 }
    - { title: "⚡ Performance", regexp: '^\S+ perf(\(.+?\))?: ', order: 3 }
    - { title: "♻️ Refactoring", regexp: '^\S+ refactor(\(.+?\))?: ', order: 4 }
    - { title: "📚 Documentation", regexp: '^\S+ docs(\(.+?\))?: ', order: 5 }
    - { title: Other, order: 999 }

release:
  name_template: "{{ .Tag }}"
  prerelease: "true"
  footer: |
    **Pre-1.0:** breaking changes are possible. Read [upgrading](https://github.com/werbot/werbot/blob/{{ .Tag }}/docs/upgrading.md) and back up first.
    **Verify this release:** [docs/security.md](https://github.com/werbot/werbot/blob/{{ .Tag }}/docs/security.md#verifying-releases).

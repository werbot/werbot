name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submodules:
    name: Submodule synchronization
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check token write access
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          PARENT_REPO: ${{ github.repository }}
        run: |
          repos=("$PARENT_REPO")
          while read -r url; do
            slug=${url#https://github.com/}
            slug=${slug#git@github.com:}
            slug=${slug%.git}
            if [[ ! "$slug" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::invalid submodule repository slug '$slug'"
              exit 1
            fi
            repos+=("$slug")
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.url$' | awk '{print $2}')
          for repo in "${repos[@]}"; do
            if ! state=$(gh api "repos/$repo" --jq '.permissions.push' 2>/dev/null) ||
              [ "$state" != "true" ]; then
              echo "::error::SUBMODULE_TOKEN lacks push access to $repo"
              exit 1
            fi
          done

      - name: Test submodule tooling
        run: scripts/submodules.test.sh

      - name: Check submodule synchronization
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            scripts/submodules check --mode main
          else
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            mapfile -t modules < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
            if git diff --quiet "origin/${BASE_REF}" -- "${modules[@]}"; then
              scripts/submodules check --mode main
            else
              scripts/submodules check --mode branch --branch "${HEAD_REF}"
            fi
          fi

  ci:
    name: Build, test and lint
    needs: submodules
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GRPCSERVER_TOKEN: test-token
      # 32 hex characters, the test suite expects this exact key.
      SECURITY_AES_KEY: 3D6A619811A17396E45D514695DCDA3A
      JWT_PUBLIC_KEY: ${{ github.workspace }}/fixtures/keys/jwt/jwt_public.key
      JWT_PRIVATE_KEY: ${{ github.workspace }}/fixtures/keys/jwt/jwt_private.key
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Build core
        run: go build ./...

      - name: Build with saas add-on
        run: go build -tags saas ./...

      - name: Build with enterprise add-on
        run: go build -tags ee ./...

      - name: Test core
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Test saas add-on
        run: go test -tags saas -count=1 ./add-on/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --timeout=10m

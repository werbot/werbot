name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: cd web && bun install --frozen-lockfile
      - run: go tool -modfile=tools/go.mod buf lint
      - if: github.event_name == 'pull_request'
        run: go tool -modfile=tools/go.mod buf breaking --against ".git#branch=origin/v2"
      - run: go tool -modfile=tools/go.mod buf generate && git diff --exit-code
      - run: go mod tidy -diff
      - run: go mod tidy -modfile=tools/go.mod -diff
      - run: go test -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

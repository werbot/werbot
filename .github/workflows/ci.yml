name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 27432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: cd web && bun install --frozen-lockfile
      - run: go tool -modfile=tools/go.mod buf lint
      - if: github.event_name == 'pull_request'
        run: go tool -modfile=tools/go.mod buf breaking --against ".git#branch=origin/main"
      - run: go tool -modfile=tools/go.mod buf generate && git diff --exit-code
      - run: go tool -modfile=tools/go.mod sqlc diff
      - run: go mod tidy -diff
      - run: go mod tidy -modfile=tools/go.mod -diff
      - run: GOOS=windows go build ./...
      # The latency budget runs alone: the other packages' tests would share its CPU.
      - run: go test -count=1 -skip '^TestExecDecisionP99$' ./...
      - run: go test -count=1 -run '^TestExecDecisionP99$' -v ./internal/gateway/
      - run: go test -race -tags load -short ./test/load/
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/connectcli/... ./internal/clientauth/... ./internal/cli/... ./internal/mcpserver/...
      - run: go build -o werbot.exe ./cmd/werbot
      - run: ./werbot.exe login --help

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: werbot_e2e
        ports:
          - 27432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: make build
      - run: cd web && bunx playwright install --with-deps chromium && bunx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug
          path: |
            web/playwright-report
            web/e2e/.server.log

  e2e-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make e2e-network

  # SSO against Keycloak (owner decision O5: every PR); make e2e-sso brings
  # the stand up and down, the last step removes it after a cancelled run
  e2e-sso:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 27432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make e2e-sso
      - if: always()
        run: docker compose -f deploy/e2e/keycloak.yaml down -v

  e2e-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # one run per ref: a newer push cancels the cluster run it supersedes
    concurrency:
      group: e2e-cluster-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make e2e-cluster
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cluster-logs
          path: test/cluster/compose.log
          if-no-files-found: ignore

  release-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.56.0
      - uses: docker/setup-buildx-action@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: release --snapshot --clean --skip=sign
      - run: docker run --rm "ghcr.io/werbot/werbot:v$(jq -r .version dist/metadata.json)-amd64" version
      - name: Compose files are valid
        working-directory: deploy
        run: |
          printf '%s\n' WERBOT_VERSION=v0.0.0 WERBOT_SECRET_KEY=x POSTGRES_PASSWORD=x \
            WERBOT_GATEWAY_SERVER_URL=https://werbot.example.com \
            WERBOT_RECORDINGS_S3_ACCESS_KEY=x WERBOT_RECORDINGS_S3_SECRET_KEY=x > .env
          docker compose config -q
          docker compose -f docker-compose.gateway.yaml config -q
          docker compose -f docker-compose.cluster.yaml --profile gateways config -q
          docker compose -f docker-compose.cluster.yaml run --rm --no-deps lb nginx -t

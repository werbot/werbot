name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: cd web && bun install --frozen-lockfile
      - run: go tool -modfile=tools/go.mod buf lint
      - if: github.event_name == 'pull_request'
        run: go tool -modfile=tools/go.mod buf breaking --against ".git#branch=origin/v2"
      - run: go tool -modfile=tools/go.mod buf generate && git diff --exit-code
      - run: go tool -modfile=tools/go.mod sqlc diff
      - run: go mod tidy -diff
      - run: go mod tidy -modfile=tools/go.mod -diff
      - run: GOOS=windows go build ./...
      - run: go test -count=1 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/connectcli/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: werbot_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: make build
      - run: cd web && bunx playwright install --with-deps chromium && bunx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug
          path: |
            web/playwright-report
            web/e2e/.server.log

  e2e-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make e2e-network

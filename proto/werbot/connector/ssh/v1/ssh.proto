syntax = "proto3";
package werbot.connector.ssh.v1;

message Config {
  string host = 1;
  // 0 → 22
  uint32 port = 2;
  string login = 3;
  // allow streams (ssh -L) to any host:port
  bool port_forwarding = 4;
  // allow remote forwards (ssh -R) on the target's loopback
  bool remote_forwarding = 5;
}

syntax = "proto3";
package werbot.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "werbot/v1/policy_paths.proto";
import "werbot/v1/selector.proto";

service PolicyService {
  rpc GetResourceRules(GetResourceRulesRequest) returns (GetResourceRulesResponse);
  rpc SetResourceRules(SetResourceRulesRequest) returns (SetResourceRulesResponse);
  // CheckAccess evaluates the organization policy for one request (probe).
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);

  // Command rules narrow which command classes subjects may run on resources.
  rpc ListCommandRules(ListCommandRulesRequest) returns (ListCommandRulesResponse);
  rpc CreateCommandRule(CreateCommandRuleRequest) returns (CreateCommandRuleResponse);
  rpc UpdateCommandRule(UpdateCommandRuleRequest) returns (UpdateCommandRuleResponse);
  rpc DeleteCommandRule(DeleteCommandRuleRequest) returns (DeleteCommandRuleResponse);
  // Class rules override the classes of matching commands.
  rpc ListClassRules(ListClassRulesRequest) returns (ListClassRulesResponse);
  rpc CreateClassRule(CreateClassRuleRequest) returns (CreateClassRuleResponse);
  rpc DeleteClassRule(DeleteClassRuleRequest) returns (DeleteClassRuleResponse);
  // Custom policies are hand-written Cedar; a permit widens access.
  rpc ListCustomPolicies(ListCustomPoliciesRequest) returns (ListCustomPoliciesResponse);
  rpc CreateCustomPolicy(CreateCustomPolicyRequest) returns (CreateCustomPolicyResponse);
  rpc UpdateCustomPolicy(UpdateCustomPolicyRequest) returns (UpdateCustomPolicyResponse);
  rpc DeleteCustomPolicy(DeleteCustomPolicyRequest) returns (DeleteCustomPolicyResponse);
  // TestCommand classifies a command and decides it for a subject on a resource (probe).
  rpc TestCommand(TestCommandRequest) returns (TestCommandResponse);

  // Path rules limit the paths a command may touch (messages in policy_paths.proto).
  rpc ListPathRules(ListPathRulesRequest) returns (ListPathRulesResponse);
  rpc CreatePathRule(CreatePathRuleRequest) returns (CreatePathRuleResponse);
  rpc UpdatePathRule(UpdatePathRuleRequest) returns (UpdatePathRuleResponse);
  rpc DeletePathRule(DeletePathRuleRequest) returns (DeletePathRuleResponse);
  // Terminal rules make a shell a checked command console or deny it.
  rpc ListTerminalRules(ListTerminalRulesRequest) returns (ListTerminalRulesResponse);
  rpc CreateTerminalRule(CreateTerminalRuleRequest) returns (CreateTerminalRuleResponse);
  rpc DeleteTerminalRule(DeleteTerminalRuleRequest) returns (DeleteTerminalRuleResponse);
}

// NetworkRule allows or denies a client CIDR.
message NetworkRule {
  string cidr = 1;
  string effect = 2; // "allow" | "deny"
}

// CountryRule allows or denies an ISO 3166-1 alpha-2 country.
message CountryRule {
  string country = 1;
  string effect = 2; // "allow" | "deny"
}

// ScheduleSlot is one allowed hour of the week in UTC; weekday 0 is Sunday.
message ScheduleSlot {
  int32 weekday = 1;
  int32 hour = 2;
}

message GetResourceRulesRequest {
  string resource_id = 1;
}
message GetResourceRulesResponse {
  repeated NetworkRule networks = 1;
  repeated CountryRule countries = 2;
  repeated ScheduleSlot schedule = 3;
}

message SetResourceRulesRequest {
  string resource_id = 1;
  repeated NetworkRule networks = 2;
  repeated CountryRule countries = 3;
  repeated ScheduleSlot schedule = 4;
}
message SetResourceRulesResponse {}

message CheckAccessRequest {
  string user_id = 1;
  string resource_id = 2;
  string ip = 3;
  google.protobuf.Timestamp time = 4; // unset: now
  uint32 port = 5 [(buf.validate.field).uint32.lte = 65535]; // target port; 0: terminal or exec
}
message CheckAccessResponse {
  bool allow = 1;
  repeated string reasons = 2;
}

// CommandRule allows, denies or asks approval for command classes.
message CommandRule {
  string id = 1;
  string name = 2;
  Subjects subjects = 3;
  ResourceSelector resource_selector = 4;
  repeated string classes = 5;
  string effect = 6; // "allow" | "deny" | "approval"
  string message = 7;
  string created_by = 8; // empty: the creator was deleted
  google.protobuf.Timestamp created_at = 9;
}

message ListCommandRulesRequest {}
message ListCommandRulesResponse {
  repeated CommandRule rules = 1;
}

message CreateCommandRuleRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 63}];
  Subjects subjects = 2;
  ResourceSelector resource_selector = 3;
  repeated string classes = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 7
    unique: true
    items: {string: {in: ["read", "write", "destructive", "privilege", "secrets", "egress", "opaque"]}}
  }];
  string effect = 5 [(buf.validate.field).string = {in: ["allow", "deny", "approval"]}];
  string message = 6 [(buf.validate.field).string.max_len = 256];
}
message CreateCommandRuleResponse {
  CommandRule rule = 1;
}

// UpdateCommandRuleRequest replaces the rule as a whole.
message UpdateCommandRuleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 63}];
  Subjects subjects = 3;
  ResourceSelector resource_selector = 4;
  repeated string classes = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 7
    unique: true
    items: {string: {in: ["read", "write", "destructive", "privilege", "secrets", "egress", "opaque"]}}
  }];
  string effect = 6 [(buf.validate.field).string = {in: ["allow", "deny", "approval"]}];
  string message = 7 [(buf.validate.field).string.max_len = 256];
}
message UpdateCommandRuleResponse {
  CommandRule rule = 1;
}

message DeleteCommandRuleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteCommandRuleResponse {}

// ClassRule gives commands matching pattern (a glob over the normalized
// command name, optionally followed by an argument prefix) the classes.
message ClassRule {
  string id = 1;
  string pattern = 2;
  repeated string classes = 3;
  string created_by = 4; // empty: the creator was deleted
  google.protobuf.Timestamp created_at = 5;
}

message ListClassRulesRequest {}
message ListClassRulesResponse {
  repeated ClassRule rules = 1;
}

message CreateClassRuleRequest {
  string pattern = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 255}];
  repeated string classes = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 7
    unique: true
    items: {string: {in: ["read", "write", "destructive", "privilege", "secrets", "egress", "opaque"]}}
  }];
}
message CreateClassRuleResponse {
  ClassRule rule = 1;
}

message DeleteClassRuleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteClassRuleResponse {}

// CustomPolicy is a hand-written Cedar text of one or more policies.
message CustomPolicy {
  string id = 1;
  string name = 2;
  string cedar = 3;
  bool enabled = 4;
  string created_by = 5; // empty: the creator was deleted
  google.protobuf.Timestamp updated_at = 6;
}

message ListCustomPoliciesRequest {}
message ListCustomPoliciesResponse {
  repeated CustomPolicy policies = 1;
}

message CreateCustomPolicyRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 63}];
  string cedar = 2 [(buf.validate.field).string = {min_bytes: 1, max_bytes: 65536}];
  bool enabled = 3;
}
message CreateCustomPolicyResponse {
  CustomPolicy policy = 1;
}

// UpdateCustomPolicyRequest replaces the policy as a whole.
message UpdateCustomPolicyRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 63}];
  string cedar = 3 [(buf.validate.field).string = {min_bytes: 1, max_bytes: 65536}];
  bool enabled = 4;
}
message UpdateCustomPolicyResponse {
  CustomPolicy policy = 1;
}

message DeleteCustomPolicyRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteCustomPolicyResponse {}

// TestCommandRequest probes a command with the caller's address at the current time.
message TestCommandRequest {
  oneof subject {
    option (buf.validate.oneof).required = true;
    string user_id = 1 [(buf.validate.field).string.uuid = true];
    string agent_id = 2 [(buf.validate.field).string.uuid = true]; // stage 12
  }
  string resource_id = 3 [(buf.validate.field).string.uuid = true];
  string command = 4 [(buf.validate.field).string = {min_bytes: 1, max_bytes: 65536}];
  string cwd = 5 [(buf.validate.field).string.max_bytes = 1024]; // "~", "~/…" or absolute; empty: "~"
}
// TestCommandResponse is the exec decision, or the connect decision when connect denies.
message TestCommandResponse {
  repeated string classes = 1;
  bool allow = 2;
  repeated string reasons = 3;
  repeated string obligations = 4;
  string message = 5;
  repeated string paths = 6; // the paths of the command, in analysis order
  repeated string path_hits = 7; // ids of the deny and approval path rules of the organization it hits
  repeated string path_outside = 8; // ids of the only path rules of the organization it leaves
}

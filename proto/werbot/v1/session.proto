syntax = "proto3";
package werbot.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service SessionService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // GetSessionRequest/Response belong to AuthService, hence the service prefix.
  rpc GetSession(SessionServiceGetSessionRequest) returns (SessionServiceGetSessionResponse);
  rpc VerifyRecording(VerifyRecordingRequest) returns (VerifyRecordingResponse);
  // Owner and admin terminate any session of the organization, a member only their own.
  rpc TerminateSession(TerminateSessionRequest) returns (TerminateSessionResponse);
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_ACTIVE = 1;
  SESSION_STATUS_ENDED = 2;
}

message Recording {
  int32 chunks = 1;
  int64 bytes = 2;
  bool finished = 3;
}

// Session ids of a deleted user, resource or gateway are empty.
message Session {
  string id = 1;
  string user_id = 2;
  string user_login = 3;
  string resource_id = 4;
  string resource_name = 5;
  string gateway_id = 6;
  string client_ip = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
  string end_reason = 10;
  Recording recording = 11;
  string kind = 12; // terminal | exec | stream | datagram
  string target = 13;
  int64 bytes_up = 14;
  int64 bytes_down = 15;
  int64 datagrams_up = 16;
  int64 datagrams_down = 17;
  string command = 18; // exec only; cut at 64 KiB
  repeated string classes = 19; // exec only: read | write | destructive | privilege | secrets | egress | opaque
  string front = 20; // ssh | web
  bool live = 21; // an open terminal session that can be watched or terminated
  int64 queries = 22; // querylog lines of the session; output only
  string record_format = 23; // asciicast | querylog; empty without a recording; output only
  repeated string paths = 25; // paths the command touched; output only
}

message ListSessionsRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  string resource_id = 2 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  SessionStatus status = 5 [(buf.validate.field).enum.defined_only = true];
  int32 page = 6 [(buf.validate.field).int32 = {gte: 0, lte: 10000000}];
  int32 page_size = 7 [(buf.validate.field).int32.gte = 0]; // above 200 is clamped to 200
}
message ListSessionsResponse {
  repeated Session sessions = 1;
  int32 next_page = 2; // 0: no further pages
}

message SessionServiceGetSessionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message SessionServiceGetSessionResponse {
  Session session = 1;
}

message VerifyRecordingRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
}
message VerifyRecordingResponse {
  bool verified = 1;
  string reason = 2;
}

message TerminateSessionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}
message TerminateSessionResponse {}

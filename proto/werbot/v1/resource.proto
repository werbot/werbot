syntax = "proto3";
package werbot.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service ResourceService {
  rpc ListResourceTypes(ListResourceTypesRequest) returns (ListResourceTypesResponse);
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  rpc ListAccessibleResources(ListAccessibleResourcesRequest) returns (ListAccessibleResourcesResponse);
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse);
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse);
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);
  rpc SetCredential(SetCredentialRequest) returns (SetCredentialResponse);
  rpc ClearCredential(ClearCredentialRequest) returns (ClearCredentialResponse);
  rpc ClearHostKey(ClearHostKeyRequest) returns (ClearHostKeyResponse);
}

message ResourceType {
  string name = 1;
  string category = 2;
  repeated string credential_kinds = 3;
  repeated string actions = 4;
  string level = 5;
  string config_type_url = 6; // "type.googleapis.com/<FullName>"
  repeated string kinds = 7;  // connector.Type.Kinds in registration order: "terminal" | "exec" | "stream"
}

message HostKey {
  string key_type = 1;
  string fingerprint_sha256 = 2;
  google.protobuf.Timestamp created_at = 3;
}

// Aggregated probe result of the online gateway instances of the pool.
message ResourceHealth {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_UNKNOWN = 1;
    STATE_HEALTHY = 2;
    STATE_UNHEALTHY = 3;
  }
  State state = 1;
  google.protobuf.Timestamp checked_at = 2; // unset while the state is unknown
  string error = 3;                         // reason of the latest failed probe; empty unless unhealthy
}

message Resource {
  string id = 1;
  string name = 2;
  string type = 3;
  string category = 4;
  string gateway_id = 5;
  google.protobuf.Any config = 6;
  string config_json = 7; // protojson of the same config, for the JSON editor
  map<string, string> labels = 8;
  string credential_kind = 9; // "" means no credential; the value is never returned
  HostKey host_key = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Duration idle_timeout = 13; // unset: the gateway default
  google.protobuf.Duration max_duration = 14; // unset: the gateway default
  ResourceHealth health = 15;
}

message ListResourceTypesRequest {}
message ListResourceTypesResponse {
  repeated ResourceType types = 1;
}

// A resource the caller may connect to, with the address and host key of its pool.
message AccessibleResource {
  string id = 1;
  string name = 2;
  string type = 3;
  repeated string kinds = 4;
  map<string, string> labels = 5;
  string ssh_address = 6; // empty without a pool or before the address is set
  string host_key = 8;    // authorized_keys line of the pool host key
}

message ListAccessibleResourcesRequest {}
message ListAccessibleResourcesResponse {
  repeated AccessibleResource resources = 1;
}

message ListResourcesRequest {
  map<string, string> label_filter = 1;
}
message ListResourcesResponse {
  repeated Resource resources = 1;
}

message GetResourceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetResourceResponse {
  Resource resource = 1;
}

// Exactly one of config / config_json is set.
message CreateResourceRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 63}];
  string type = 2 [(buf.validate.field).string = {min_len: 1, max_len: 32}];
  string gateway_id = 3 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  google.protobuf.Any config = 4;
  string config_json = 5 [(buf.validate.field).string.max_len = 65536];
  map<string, string> labels = 6;
  // Unset: the gateway default.
  google.protobuf.Duration idle_timeout = 7 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 86400}
  }];
  google.protobuf.Duration max_duration = 8 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 604800}
  }];
}
message CreateResourceResponse {
  Resource resource = 1;
}

// Like Create without type; both config fields empty keeps the current config.
message UpdateResourceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 63}];
  string gateway_id = 3 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  google.protobuf.Any config = 4;
  string config_json = 5 [(buf.validate.field).string.max_len = 65536];
  map<string, string> labels = 6;
  // Unset: the gateway default.
  google.protobuf.Duration idle_timeout = 7 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 86400}
  }];
  google.protobuf.Duration max_duration = 8 [(buf.validate.field).duration = {
    gte: {seconds: 60}
    lte: {seconds: 604800}
  }];
}
message UpdateResourceResponse {
  Resource resource = 1;
}

message DeleteResourceRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteResourceResponse {}

message SetCredentialRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string kind = 2 [(buf.validate.field).string = {min_len: 1, max_len: 32}];
  bytes value = 3 [(buf.validate.field).bytes = {min_len: 1, max_len: 65536}];
}
message SetCredentialResponse {}

message ClearCredentialRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
}
message ClearCredentialResponse {}

message ClearHostKeyRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
}
message ClearHostKeyResponse {}

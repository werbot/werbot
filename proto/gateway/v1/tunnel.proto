syntax = "proto3";
package gateway.v1;

import "buf/validate/validate.proto";

// TunnelService is the gateway-to-core control plane. The caller is a gateway
// instance identified by its mTLS client certificate, never by request fields.
service TunnelService {
  // Connect carries heartbeats up and policy snapshots down.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  rpc AuthenticateUser(AuthenticateUserRequest) returns (AuthenticateUserResponse);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);
  rpc PinHostKey(PinHostKeyRequest) returns (PinHostKeyResponse);
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  rpc UploadRecordingChunk(UploadRecordingChunkRequest) returns (UploadRecordingChunkResponse);
  rpc FinishRecording(FinishRecordingRequest) returns (FinishRecordingResponse);
}

message ConnectRequest {
  oneof msg {
    Heartbeat heartbeat = 1;
  }
}

message Heartbeat {
  string version = 1 [(buf.validate.field).string.max_len = 64];
  repeated string connectors = 2 [(buf.validate.field).repeated = {
    max_items: 64
    items: {string: {min_len: 1, max_len: 64}}
  }];
  // bounded by the WERBOT_GATEWAY_MAX_SESSIONS ceiling
  repeated string active_session_ids = 3 [(buf.validate.field).repeated = {
    max_items: 10000
    items: {string: {uuid: true}}
  }];
}

message ConnectResponse {
  oneof msg {
    Snapshot snapshot = 1;
  }
}

message Snapshot {
  string cedar_policies = 1;
  bytes entities_json = 2;
  repeated Resource resources = 3;
  repeated string blocklist = 4;
  // hex SHA-256 of the deterministic encoding without this field
  string version = 5;
}

message Resource {
  string id = 1;
  string name = 2;
  string type = 3;
  // protojson of the connector config
  bytes config_json = 4;
}

message AuthenticateUserRequest {
  oneof by {
    option (buf.validate.oneof).required = true;
    string fingerprint_sha256 = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
    string login = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  }
  string client_ip = 3 [(buf.validate.field).string.ip = true];
}

message AuthenticateUserResponse {
  string user_id = 1;
  string login = 2;
  repeated string team_ids = 3;
  string country = 4;
}

message StartSessionRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string resource_id = 2 [(buf.validate.field).string.uuid = true];
  string client_ip = 3 [(buf.validate.field).string.ip = true];
}

message StartSessionResponse {
  string session_id = 1;
  Credential credential = 2;
}

message Credential {
  string kind = 1;
  bytes value = 2;
}

message EndSessionRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  // gateway-side end reasons; gateway_lost is set only by the server
  string reason = 2 [(buf.validate.field).string = {
    in: ["closed", "error", "internal_error", "gateway_shutdown", "recording_unavailable"]
  }];
}

message EndSessionResponse {}

message PinHostKeyRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  // SSH: alg = PublicKey.Type(), public_key = PublicKey.Marshal()
  bytes public_key = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 8192}];
  string alg = 3 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message PinHostKeyResponse {}

message RenewCertificateRequest {
  bytes csr_der = 1 [(buf.validate.field).bytes = {min_len: 1, max_len: 4096}];
}

message RenewCertificateResponse {
  bytes cert_pem = 1;
}

// UploadRecordingChunk stores chunk seq of a session served by the caller.
// hash = SHA-256(previous hash || gz); the first chunk chains from 32 zero bytes.
message UploadRecordingChunkRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  int32 seq = 2 [(buf.validate.field).int32.gte = 0];
  bytes hash = 3 [(buf.validate.field).bytes.len = 32];
  // gzip of at most 64 KiB of asciicast v2 lines
  bytes gz = 4 [(buf.validate.field).bytes = {min_len: 1, max_len: 131072}];
}

message UploadRecordingChunkResponse {}

// FinishRecording closes a recording: the totals must match the ingested chain.
message FinishRecordingRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  int32 chunks = 2 [(buf.validate.field).int32.gte = 1];
  int64 bytes = 3 [(buf.validate.field).int64.gte = 1];
  bytes final_hash = 4 [(buf.validate.field).bytes.len = 32];
}

message FinishRecordingResponse {}

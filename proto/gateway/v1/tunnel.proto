syntax = "proto3";
package gateway.v1;

import "buf/validate/validate.proto";
import "gateway/v1/tunnel_agent.proto";
import "gateway/v1/tunnel_stream.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// TunnelService is the gateway-to-core control plane. The caller is a gateway
// instance identified by its mTLS client certificate, never by request fields.
service TunnelService {
  // Connect carries heartbeats up and policy snapshots down.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
  rpc AuthenticateUser(AuthenticateUserRequest) returns (AuthenticateUserResponse);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);
  rpc PinHostKey(PinHostKeyRequest) returns (PinHostKeyResponse);
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  rpc UploadRecordingChunk(UploadRecordingChunkRequest) returns (UploadRecordingChunkResponse);
  rpc FinishRecording(FinishRecordingRequest) returns (FinishRecordingResponse);
  // RequestApproval asks the approvers to allow one command of a session;
  // the decision arrives as approval_decided on Connect.
  rpc RequestApproval(RequestApprovalRequest) returns (RequestApprovalResponse);
  rpc GetApproval(GetApprovalRequest) returns (GetApprovalResponse);
  rpc RecordDenial(RecordDenialRequest) returns (RecordDenialResponse);
  rpc Stream(stream StreamRequest) returns (stream StreamResponse);
}

message ConnectRequest {
  oneof msg {
    Heartbeat heartbeat = 1;
  }
}

message Heartbeat {
  string version = 1 [(buf.validate.field).string.max_bytes = 64];
  repeated string connectors = 2 [(buf.validate.field).repeated = {
    max_items: 64
    items: {string: {min_len: 1, max_bytes: 64}}
  }];
  // bounded by the WERBOT_GATEWAY_MAX_SESSIONS ceiling
  repeated string active_session_ids = 3 [(buf.validate.field).repeated = {
    max_items: 10000
    items: {string: {uuid: true}}
  }];
  // sessions whose counters changed; the gateway sends the rest next time
  repeated SessionCounters counters = 4 [(buf.validate.field).repeated.max_items = 5000];
  repeated Denial denials = 5 [(buf.validate.field).repeated.max_items = 100];
  // probe results that changed; the first heartbeat after start carries all
  repeated ResourceHealth health = 6 [(buf.validate.field).repeated.max_items = 1000];
}

// SessionCounters are a session's traffic totals; up is client to target.
message SessionCounters {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  int64 bytes_up = 2;
  int64 bytes_down = 3;
  int64 datagrams_up = 4;
  int64 datagrams_down = 5;
}

// Denial is a connection attempt the gateway refused. String bounds count
// bytes; one invalid item rejects the whole heartbeat, so the gateway truncates
// strings (keeping UTF-8 whole) and sends user_id and client_ip only when well-formed.
message Denial {
  string user_id = 1 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  string key_fingerprint = 2 [(buf.validate.field).string.max_bytes = 128];
  // resource name from the login; the server resolves the id when it exists
  string resource = 3 [(buf.validate.field).string.max_bytes = 63];
  string kind = 4 [(buf.validate.field).string.max_bytes = 16];
  // stream or datagram: host:port; exec or terminal with a command: the command
  string target = 5 [(buf.validate.field).string.max_bytes = 1024];
  string client_ip = 6 [(buf.validate.field).string = {ip: true, max_bytes: 64}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  string reason = 7 [(buf.validate.field).string = {
    in: ["denied", "target_not_allowed", "unsupported_type", "unsupported_kind", "busy", "spool_full", "auth_failed", "approval_denied", "approval_timeout"]
  }];
  google.protobuf.Timestamp at = 8;
  // the agent run of the attempt, when RecordDenial was not reachable
  string agent_run_id = 9 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // a console line denied inside this session (target: the line) and its decision
  string session_id = 10 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  repeated string classes = 11 [(buf.validate.field).repeated = {
    max_items: 7
    items: {string: {in: ["read", "write", "destructive", "privilege", "secrets", "egress", "opaque"]}}
  }];
  repeated string paths = 12 [(buf.validate.field).repeated = {max_items: 16, items: {string: {max_bytes: 1024}}}];
  repeated string reasons = 13 [(buf.validate.field).repeated = {max_items: 16, items: {string: {max_bytes: 128}}}];
}

// ResourceHealth is one probe result of a resource.
message ResourceHealth {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  bool ok = 2;
  // the gateway truncates; the bound keeps a full heartbeat under the 4 MiB read limit
  string error = 3 [(buf.validate.field).string.max_bytes = 100];
  google.protobuf.Timestamp checked_at = 4;
}

// PoolInstances are the online instances of the caller's pool, sorted.
message PoolInstances {
  repeated string ids = 1;
}

message ConnectResponse {
  oneof msg {
    Snapshot snapshot = 1;
    PoolInstances pool_instances = 2;
    ApprovalDecided approval_decided = 3;
    OpenStream open_stream = 4;
    Terminate terminate = 5;
  }
}

// ApprovalDecided is a decided command approval of the receiving instance.
message ApprovalDecided {
  string approval_id = 1;
  // "approved" or "denied"
  string status = 2;
}

message Snapshot {
  string cedar_policies = 1;
  bytes entities_json = 2;
  repeated Resource resources = 3;
  repeated string blocklist = 4;
  // hex SHA-256 of the deterministic encoding without this field
  string version = 5;
  // organization members sorted by user_id; a change revokes sessions on the gateway
  repeated Member members = 6;
  // unix seconds when grants and locks expire, ascending, unique
  repeated int64 expirations = 7;
  // "best_effort" or "strict": strict ends sessions when the tunnel is down too long
  string lock_mode = 8;
  // "agents", "all" or "none": whose exec output the gateway masks
  string mask_output = 9;
  // the organization's command class overrides, ascending pattern
  repeated ClassRule class_rules = 10;
  // the organization's path rules by ascending id; only in a compiled snapshot
  repeated PathRule path_rules = 17;
  // the organization's user CA keys (authorized_keys); empty: no certificate is accepted
  repeated string user_ca_keys = 18;
}

// ClassRule gives the commands matching pattern the classes.
message ClassRule {
  string pattern = 1;
  repeated string classes = 2;
}

// PathRule is a path rule for EvalPaths: access "read"|"write"|"any", effect "only"|"deny"|"approval".
message PathRule {
  string id = 1;
  repeated string paths = 2;
  string access = 3;
  string effect = 4;
}

// Member is an organization member and its teams, sorted.
message Member {
  string user_id = 1;
  repeated string team_ids = 2;
}

message Resource {
  string id = 1;
  string name = 2;
  string type = 3;
  // protojson of the connector config
  bytes config_json = 4;
  // unset: the gateway default
  google.protobuf.Duration idle_timeout = 5;
  google.protobuf.Duration max_duration = 6;
  // SHA256 fingerprint of the pinned target host key; empty: none pinned yet
  string host_key_sha256 = 8;
}

message AuthenticateUserRequest {
  oneof by {
    option (buf.validate.oneof).required = true;
    string fingerprint_sha256 = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
    string login = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
    CertIdentity cert = 4;
    string web_ticket = 5 [(buf.validate.field).string.uuid = true];
  }
  string client_ip = 3 [(buf.validate.field).string = {ip: true, max_bytes: 64}];
}

// CertIdentity is a user certificate the gateway verified against the
// organization's user CA: its werbot extensions, principal and fingerprint.
message CertIdentity {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string cli_session_id = 2 [(buf.validate.field).string.uuid = true];
  string login = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string cert_fingerprint = 4 [(buf.validate.field).string.max_len = 128];
  // an agent certificate: both set, or neither
  string agent_id = 5 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  string run_id = 6 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

message AuthenticateUserResponse {
  string user_id = 1;
  string login = 2;
  repeated string team_ids = 3;
  string country = 4;
  AgentInfo agent = 5;
  WebTicket web = 6;
}

message StartSessionRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string resource_id = 2 [(buf.validate.field).string.uuid = true];
  string client_ip = 3 [(buf.validate.field).string = {ip: true, max_bytes: 64}];
  string kind = 4 [(buf.validate.field).string = {
    in: ["terminal", "exec", "stream", "datagram"]
  }];
  // host:port the gateway connects to; empty for terminal and exec
  string target = 5 [(buf.validate.field).string.max_bytes = 300];
  // exec only: the authorized command (the gateway truncates) and its classes
  string command = 6 [(buf.validate.field).string.max_bytes = 65536];
  repeated string classes = 7 [(buf.validate.field).repeated = {
    max_items: 7
    items: {string: {in: ["read", "write", "destructive", "privilege", "secrets", "egress", "opaque"]}}
  }];
  // the paths the authorized command touches
  repeated string paths = 15 [(buf.validate.field).repeated = {max_items: 256, items: {string: {max_bytes: 1024}}}];
  // an agent's session: its run counts the action; a tool call of another run is not stored
  string agent_run_id = 8 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  string tool_call_id = 9 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  string front = 10 [(buf.validate.field).string = {in: ["ssh", "web"]}, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

message StartSessionResponse {
  string session_id = 1;
  Credential credential = 2;
}

message Credential {
  string kind = 1;
  bytes value = 2;
}

message EndSessionRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  // gateway-side end reasons; gateway_lost is set only by the server;
  // policy_stale: a strict organization's tunnel was down too long
  string reason = 2 [(buf.validate.field).string = {
    in: ["closed", "error", "internal_error", "gateway_shutdown", "recording_unavailable", "idle_timeout", "max_duration", "access_revoked", "policy_stale", "terminated"]
  }];
  // final totals; unset keeps the stored ones; session_id must equal session_id above
  SessionCounters counters = 3;
  // exec: the exit status and the SHA-256 of the recorded output
  optional int32 exit_code = 4;
  bytes output_sha256 = 5 [(buf.validate.field).bytes.len = 32, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  // console only: the last checked command (the gateway truncates), its classes and paths
  string command = 8 [(buf.validate.field).string.max_bytes = 65536];
  repeated string classes = 9 [(buf.validate.field).repeated = {
    max_items: 7
    items: {string: {in: ["read", "write", "destructive", "privilege", "secrets", "egress", "opaque"]}}
  }];
  repeated string paths = 10 [(buf.validate.field).repeated = {max_items: 256, items: {string: {max_bytes: 1024}}}];
}

message EndSessionResponse {}

message PinHostKeyRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  // SSH: alg = PublicKey.Type(), public_key = PublicKey.Marshal()
  bytes public_key = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 8192}];
  string alg = 3 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message PinHostKeyResponse {}

message RenewCertificateRequest {
  bytes csr_der = 1 [(buf.validate.field).bytes = {min_len: 1, max_len: 4096}];
}

message RenewCertificateResponse {
  bytes cert_pem = 1;
}

// UploadRecordingChunk stores chunk seq of a session served by the caller.
// hash = SHA-256(previous hash || gz); the first chunk chains from 32 zero bytes.
message UploadRecordingChunkRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  int32 seq = 2 [(buf.validate.field).int32.gte = 0];
  bytes hash = 3 [(buf.validate.field).bytes.len = 32];
  // gzip of at most 64 KiB of asciicast v2 lines
  bytes gz = 4 [(buf.validate.field).bytes = {min_len: 1, max_len: 131072}];
}

message UploadRecordingChunkResponse {}

// FinishRecording closes a recording: the totals must match the ingested chain.
message FinishRecordingRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  int32 chunks = 2 [(buf.validate.field).int32.gte = 1];
  int64 bytes = 3 [(buf.validate.field).int64.gte = 1];
  bytes final_hash = 4 [(buf.validate.field).bytes.len = 32];
}

message FinishRecordingResponse {}

message RequestApprovalRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string resource_id = 2 [(buf.validate.field).string.uuid = true];
  // empty: the user's own command
  string agent_run_id = 3 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  string command = 4 [(buf.validate.field).string = {min_bytes: 1, max_bytes: 16384}];
  repeated string classes = 5 [(buf.validate.field).repeated = {
    max_items: 32
    items: {string: {max_len: 64}}
  }];
  repeated string reasons = 6 [(buf.validate.field).repeated = {
    max_items: 32
    items: {string: {max_len: 256}}
  }];
}

message RequestApprovalResponse {
  string approval_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  // the approval page for the approvers
  string url = 3;
  // "pending", or "approved" for an agent's approved command it asks again
  string status = 4;
}

message GetApprovalRequest {
  string approval_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetApprovalResponse {
  // "pending", "approved", "denied", "expired" or "canceled"
  string status = 1;
}
